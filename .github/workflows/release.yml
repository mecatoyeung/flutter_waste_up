name: Build and release Waste Up

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: waste-up-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: frontend/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: frontend/pubspec.yaml
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK and App Bundle
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --dart-define-from-file=lib/environments/local.json
          flutter build appbundle --release --dart-define-from-file=lib/environments/local.json

      - name: Publish Android artifacts
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v5
        with:
          name: waste-up-android
          if-no-files-found: error
          path: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab

      - name: Configure GitHub Pages
        id: pages
        if: matrix.target == 'web' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Build web bundle
        if: matrix.target == 'web'
        run: |
          BASE_HREF="${{ steps.pages.outputs.base_path || '/' }}"
          flutter build web --release --dart-define-from-file=lib/environments/local.json --base-href "${BASE_HREF%/}/"

      - name: Upload GitHub Pages artifact
        if: matrix.target == 'web' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: Package web bundle
        if: matrix.target == 'web'
        run: tar -czf waste-up-web.tar.gz -C build/web .

      - name: Publish web artifact
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v5
        with:
          name: waste-up-web
          if-no-files-found: error
          path: frontend/waste-up-web.tar.gz

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  deploy-pages:
    name: Deploy web app to GitHub Pages
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
